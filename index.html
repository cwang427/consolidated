<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ConsoliDated</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='6' y='8' width='88' height='86' rx='14' fill='%23ffffff' stroke='%23d8c9bc' stroke-width='3'/><path d='M6 36 h88 v-14 a14 14 0 0 0 -14 -14 h-60 a14 14 0 0 0 -14 14 z' fill='%23c9536f'/><text x='50' y='30' font-size='17' font-weight='700' fill='%23ffffff' text-anchor='middle' font-family='Arial'>JUL</text><text x='50' y='79' font-size='44' font-weight='800' fill='%233d2c33' text-anchor='middle' font-family='Arial'>19</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ConsoliDated">
<meta name="theme-color" content="#faf5ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#faf5ef; --card:#fffdf9; --ink:#3d2c33; --muted:#9a8790;
  --rose:#c9536f; --rose-dark:#a83a55; --rose-soft:#f7dfe5;
  --teal:#3e8e8c; --teal-soft:#dff0ee;
  --plum:#5b3a4a; --line:#eadfd6; --gold:#c9a227;
  --shadow:0 2px 10px rgba(91,58,74,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",-apple-system,system-ui,sans-serif;overscroll-behavior-y:none}
h1,h2,h3,.serif{font-family:"Fraunces",Georgia,serif;font-weight:700;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea,select{font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--rose)}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:13px;font-weight:700;color:var(--plum);margin:14px 0 5px}

#app{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + var(--safe-b))}
.screen-title{font-size:28px;margin:6px 0 2px}
.screen-sub{color:var(--muted);font-size:14px;margin:0 0 14px}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.idea-card{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.idea-card .grow{flex:1;min-width:0}
.idea-title{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:17px;margin:0}
.idea-meta{font-size:13px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--rose-soft);color:var(--rose-dark)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.plain{background:#f1e9df;color:var(--plum)}
.done-badge{font-size:12px;font-weight:700;color:var(--teal);white-space:nowrap}
.filters{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}
.filters button{padding:7px 14px;border-radius:99px;background:#f1e9df;color:var(--plum);font-size:13.5px;font-weight:700;white-space:nowrap}
.filters button.on{background:var(--plum);color:#fff}

/* ---- empty state ---- */
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.empty .big{font-size:44px;margin-bottom:10px}

/* ---- tab bar ---- */
#tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + var(--safe-b));z-index:400}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--muted);width:70px}
#tabbar button.on{color:var(--rose-dark)}
#tabbar .ico{font-size:21px;line-height:1.2}

/* ---- FAB ---- */
#fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--rose);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(201,83,111,.45);z-index:401;display:flex;align-items:center;justify-content:center}
#fab:active{transform:scale(.94)}

/* ---- overlays / sheets ---- */
.overlay{position:fixed;inset:0;background:rgba(61,44,51,.35);z-index:500;display:flex;align-items:flex-end;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;max-height:94dvh;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;font-size:19px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .hbtn{font-size:14px;font-weight:700;color:var(--rose-dark);padding:6px 10px;border-radius:10px}
.sheet-head .hbtn.subtle{color:var(--muted)}
.sheet-body{overflow-y:auto;padding:14px 16px calc(28px + var(--safe-b));-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---- maps ---- */
.map{height:230px;border-radius:14px;border:1px solid var(--line);z-index:1}
.map.tall{height:calc(100dvh - 210px)}
.map.tall.with-cats{height:calc(100dvh - 258px)}
.home-pin{background:#fff;border:2px solid var(--plum);border-radius:12px;padding:1px 7px;font-size:12px;font-weight:700;color:var(--plum);white-space:nowrap;box-shadow:var(--shadow);transform:translate(-50%,-100%)}
.num-pin{width:26px;height:26px;border-radius:50%;background:var(--rose);border:2px solid #fff;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transform:translate(-50%,-50%)}
.idea-pin{width:18px;height:18px;border-radius:50% 50% 50% 0;background:var(--rose);border:2px solid #fff;transform:rotate(-45deg) translate(-70%,-10%);box-shadow:var(--shadow)}
.mem-pin{width:16px;height:16px;border-radius:50%;background:var(--plum);border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:var(--shadow)}
.maplinks{display:flex;gap:8px;margin-top:8px}
.maplinks a{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--plum);background:#f1e9df;border-radius:10px;padding:8px 4px;text-decoration:none;white-space:nowrap}
.maplinks a:active{background:var(--rose-soft)}
.leaflet-popup-content .maplinks a{padding:6px 8px;white-space:nowrap}
.leaflet-popup-content{min-width:170px}

/* ---- notes / reflections ---- */
.note-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.note-box .who{font-size:12.5px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dotA,.dotB{width:9px;height:9px;border-radius:50%;display:inline-block}
.dotA{background:var(--rose)} .dotB{background:var(--teal)}
.note-box textarea{border:none;background:#fdf9f4;min-height:70px}
/* textareas in sheets auto-grow to fit their text (autoGrow), so they never scroll
   internally and never need a drag handle */
.sheet textarea{resize:none;overflow:hidden}
.note-box .ro{white-space:pre-wrap;color:var(--ink);font-size:15px;min-height:22px}
.note-box .ro.dim{color:var(--muted);font-style:italic}

/* ---- journal ---- */
.seg{display:flex;background:#f1e9df;border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:700;font-size:14px;color:var(--plum)}
.seg button.on{background:#fff;box-shadow:var(--shadow);color:var(--rose-dark)}
.mem-card{cursor:pointer}
.mem-day{font-size:12.5px;font-weight:800;color:var(--rose-dark);text-transform:uppercase;letter-spacing:.06em}
.mem-title{font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:700;margin:2px 0 6px}
.thumbstrip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;border-radius:10px}
.thumbstrip img{height:86px;border-radius:10px;flex-shrink:0}
.mem-icons{font-size:13px;color:var(--muted);margin-top:6px}

/* ---- calendar ---- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h3{margin:0;font-size:19px}
.cal-head button{font-size:22px;padding:4px 14px;color:var(--rose-dark)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-cell{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;font-size:12px}
.cal-cell.blank{background:transparent;border:none}
.cal-cell .dnum{position:absolute;top:3px;left:5px;font-weight:700;z-index:2}
.cal-cell.has{cursor:pointer;border-color:var(--rose)}
.cal-cell.has .dnum{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.cal-cell.has.nopic{background:var(--rose-soft)}
.cal-cell.has.nopic .dnum{color:var(--rose-dark);text-shadow:none}
.cal-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cal-cell .heart{position:absolute;right:3px;bottom:2px;font-size:11px;z-index:2}
.cal-cell.today{outline:2px solid var(--gold)}

/* ---- photos ---- */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
.add-photo{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700;gap:2px;cursor:pointer}
.add-photo .plus{font-size:24px;color:var(--rose)}
.arr-cell{position:relative}
.arr-cell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.arr-bar{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(61,44,51,.6);border-radius:0 0 10px 10px}
.arr-bar button{flex:1;color:#fff;font-size:15px;font-weight:800;padding:5px 0}
.arr-bar button:disabled{opacity:.25}
.arr-bar button.on{color:var(--gold)}
.cov-badge{position:absolute;top:4px;left:4px;background:var(--gold);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px}
.arrange-btn{font-size:12.5px;font-weight:800;color:var(--rose-dark)}
#viewer{position:fixed;inset:0;background:rgba(20,10,14,.96);z-index:700;display:flex;flex-direction:column}
#viewer .v-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none;overflow:hidden}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;will-change:transform}
#viewer .v-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px calc(14px + var(--safe-b));color:#fff}
#viewer .v-bar button{font-size:15px;font-weight:700;color:#fff;padding:8px 14px}
#viewer .v-close{position:absolute;top:14px;right:14px;color:#fff;font-size:26px;padding:8px;z-index:2}

/* ---- location picker ---- */
.loc-list{margin:6px 0}
.loc-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:14px}
.loc-row .n{width:22px;height:22px;border-radius:50%;background:var(--rose);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-row .x{color:var(--muted);font-size:18px;padding:2px 6px}
.searchrow{display:flex;gap:8px}
.searchrow button{background:var(--plum);color:#fff;border-radius:12px;padding:0 16px;font-weight:700;flex-shrink:0}
.results{margin-top:6px}
.results button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

/* ---- buttons ---- */
.btn{display:block;width:100%;background:var(--rose);color:#fff;font-weight:800;font-size:16px;padding:14px;border-radius:14px;text-align:center;margin-top:18px}
.btn:active{background:var(--rose-dark)}
.btn.ghost{background:none;color:var(--rose-dark);border:1.5px solid var(--rose);margin-top:10px}
.btn.danger{background:none;color:#b3413f;font-size:14px;padding:8px;margin-top:14px}
.btn.small{width:auto;display:inline-block;padding:9px 18px;font-size:14px;margin-top:8px}
.row2{display:flex;gap:10px}.row2>*{flex:1}

/* ---- setup / config screens ---- */
.hero{text-align:center;padding:40px 10px 20px}
.hero .big{font-size:56px}
.hero h1{font-size:30px;margin:10px 0 6px}
.hero p{color:var(--muted);max-width:400px;margin:0 auto}
.whoami-btn{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;font-size:18px;font-weight:700;margin-bottom:12px;font-family:"Fraunces",Georgia,serif}
.whoami-btn:active{border-color:var(--rose)}
code{background:#f1e9df;border-radius:6px;padding:1px 6px;font-size:13px}
.steps{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;margin-top:18px}
.steps p{margin:12px 0}

/* ---- calendar icon (JUL 19) ---- */
.calico{display:inline-flex;flex-direction:column;width:64px;height:64px;border-radius:14px;background:#fff;border:1px solid #d8c9bc;box-shadow:var(--shadow);overflow:hidden;vertical-align:middle}
.calico i{font-style:normal;background:var(--rose);color:#fff;font-size:12px;font-weight:800;letter-spacing:.12em;padding:3px 0;font-family:"Nunito Sans",sans-serif;line-height:1.2}
.calico b{flex:1;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:800;color:var(--ink);font-family:"Nunito Sans",sans-serif}

/* ---- toast ---- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safe-b));background:var(--plum);color:#fff;font-size:14px;font-weight:700;padding:10px 20px;border-radius:99px;z-index:800;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.section-title{font-size:14px;font-weight:800;color:var(--plum);margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabbar" hidden>
  <button id="tab-ideas" onclick="setTab('ideas')"><span class="ico">💡</span>Ideas</button>
  <button id="tab-journal" onclick="setTab('journal')"><span class="ico">📖</span>Journal</button>
  <button id="tab-map" onclick="setTab('map')"><span class="ico">🗺️</span>Map</button>
  <button id="tab-settings" onclick="setTab('settings')"><span class="ico">⚙️</span>Settings</button>
</nav>
<button id="fab" hidden onclick="fabTap()">+</button>
<div id="toast"></div>
<input type="file" id="photoInput" accept="image/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   STEP 1 — PASTE YOUR FIREBASE CONFIG BELOW
   (Firebase console → Project settings → Your apps → Web app)
   Only apiKey, authDomain, and projectId are required.
   ═══════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyBmghUX9FXx0xmzjFS0igSrWlxEubx7YXg",
  authDomain: "consolidated-a3254.firebaseapp.com",
  projectId: "consolidated-a3254",
  storageBucket: "consolidated-a3254.firebasestorage.app",
  messagingSenderId: "721414435101",
  appId: "1:721414435101:web:aae462a6101d14a2adf1f4"
};
/* ═══════════════════════════════════════════════════════════════ */

// ══════════ state & helpers ══════════
const CATS=['Food & drink','Outdoors','Arts & culture','At home','Adventure','Day trip','Other'];
// identity = SHA-256 of the signed-in email; the real addresses live only in the Firebase console
const PARTNERS={A:{name:'Mr. Soccerboy',emailHash:'9ed83fa4276eb047b246d4ad094cf8daf2bef8187f2c97e98a67c8294c30f929'},B:{name:'Ms. Chairgirl',emailHash:'e8f60b7542c1a41a288c21f2d65ac96ef6c299fa71f1fa8bbce7859cc2e93cd9'}};
let db=null;
const S={ready:false,cfgOk:false,authKnown:false,user:null,settings:null,ideas:[],dates:[],photos:[],
  me:localStorage.getItem('dj_me')||null,
  tab:'ideas',ideaFilter:'all',journalMode:'album',
  cal:(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})()};
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,ms=1800){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function pname(k){return PARTNERS[k].name}
const photosOf=id=>S.photos.filter(p=>p.dateId===id).sort((a,b)=>((a.order??a.created)||0)-((b.order??b.created)||0));
const liveDates=()=>S.dates.filter(d=>!d.trash);
const datesOfIdea=id=>liveDates().filter(d=>d.ideaId===id);
const otherOf=k=>k==='A'?'B':'A';
function fmtDay(ds){if(!ds)return'';const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function fmtTime(t){const[h,mi]=t.split(':').map(Number);return `${((h+11)%12)+1}:${String(mi).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// ══════════ boot ══════════
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
// identity follows the login when the email hash matches a partner
async function applyIdentity(u){
  S.meLocked=false;
  if(!u||!u.email||!crypto.subtle)return;
  const h=await sha256(u.email.toLowerCase());
  if(h===PARTNERS.A.emailHash){S.me='A';S.meLocked=true}
  else if(h===PARTNERS.B.emailHash){S.me='B';S.meLocked=true}
}
function boot(){
  S.cfgOk=!/PASTE_YOUR/.test(firebaseConfig.apiKey||'');
  if(!S.cfgOk){render();return}
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore();
  firebase.auth().onAuthStateChanged(async u=>{S.authKnown=true;S.user=u;if(u){await applyIdentity(u);subscribe()}render()});
}
// on first load, open the journal on the newest month that has memories (falling back to
// the oldest) so the album isn't blank when nothing was logged this month
let calInited=false;
function initCalMonth(){
  if(calInited||!S.dates.length)return;
  calInited=true;
  const ms=memoryMonths(),cur=calKey();
  if(!ms.length||ms.includes(cur))return;
  goMonth(ms.filter(m=>m<=cur).pop()||ms[0]);
}
let subbed=false;
function subscribe(){
  if(subbed)return;subbed=true;
  db.collection('meta').doc('settings').onSnapshot(d=>{S.settings=d.exists?d.data():{};S.ready=true;render()},
    e=>{console.error(e);S.ready=true;render();toast('Database error — check your Firestore rules',4000)});
  db.collection('ideas').onSnapshot(q=>{S.ideas=q.docs.map(d=>({id:d.id,...d.data()}));S.ideas.sort((a,b)=>(b.created||0)-(a.created||0));render()});
  db.collection('dates').onSnapshot(q=>{S.dates=q.docs.map(d=>({id:d.id,...d.data()}));S.dates.sort((a,b)=>(b.day||'').localeCompare(a.day||'')||(b.created||0)-(a.created||0));initCalMonth();render()});
  db.collection('photos').onSnapshot(q=>{S.photos=q.docs.map(d=>({id:d.id,...d.data()}));S.photos.sort((a,b)=>(a.created||0)-(b.created||0));render();refreshPhotoGrid()});
}

let lastScreen=null;
function render(){

  const fo=document.activeElement;
  // don't clobber typing during same-screen refreshes — but never block a screen change
  if(screen===lastScreen&&fo&&app.contains(fo)&&/INPUT|TEXTAREA|SELECT/.test(fo.tagName))return;
  if(screen!==lastScreen&&fo&&fo.blur)fo.blur();
  lastScreen=screen;
  if(!S.cfgOk){tb.hidden=true;fab.hidden=true;app.innerHTML=configHelp();return}
  if(!S.authKnown){app.innerHTML='<div class="hero"><div class="big"><span class="calico"><i>JUL</i><b>19</b></span></div><p>Loading…</p></div>';return}

const overlayStack=[];
function openOverlay(inner){
  const el=document.createElement('div');el.className='overlay';
  el.innerHTML=`<div class="sheet">${inner}</div>`;
  el.addEventListener('click',e=>{if(e.target===el)closeTop()});
  document.body.appendChild(el);overlayStack.push(el);
  growAll(el);setTimeout(()=>growAll(el),50); // again once webfonts settle
  return el;
}
function closeTop(){const el=overlayStack.pop();if(el)el.remove()}
// grow a textarea to fit its content: a nested scrollbar in a 70px box makes both
// reading a long reflection and keeping track of what you've typed needlessly hard
function autoGrow(el){
  if(!el)return;
  el.style.height='auto';
  el.style.height=(el.scrollHeight+el.offsetHeight-el.clientHeight)+'px';
}
function growAll(root){(root||document).querySelectorAll('.sheet textarea').forEach(autoGrow)}
function closeAll(){while(overlayStack.length)closeTop()}

// ══════════ maps ══════════
function mkMap(elId){
  const m=L.map(elId,{zoomControl:false,scrollWheelZoom:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  return m;
}
function homeMarkers(m){
  const pts=[];
  (S.settings&&S.settings.homes||[]).forEach(h=>{
    if(h&&h.lat!=null){
      L.marker([h.lat,h.lng],{icon:L.divIcon({className:'',html:`<div class="home-pin">🏠 ${esc(h.label||'')}</div>`,iconSize:[0,0]}),zIndexOffset:500}).addTo(m);
      pts.push([h.lat,h.lng]);
    }});
  return pts;
}
function fit(m,pts){
  if(!pts.length)m.setView([33.749,-84.388],11);
  else if(pts.length===1)m.setView(pts[0],14);
  else m.fitBounds(pts,{padding:[40,40]});
}
function addNumPin(m,l,ix,total){
  const html=`<div class="num-pin">${(!total||total<=1)?'':ix+1}</div>`;
  L.marker([l.lat,l.lng],{icon:L.divIcon({className:'',html,iconSize:[0,0]})}).addTo(m).bindPopup(esc(l.name));
}
// "Open in Apple/Google Maps" links. One stop → a pin, zoomed in; 2+ stops → directions
// through every stop in order. (External map URLs can't carry extra pins, so the home
// bases only show on the in-app maps.)
const ll=l=>`${l.lat},${l.lng}`;
function extMapLinks(locs){
  if(!locs||!locs.length)return'';
  let a,g;
  if(locs.length===1){
    a=`https://maps.apple.com/?ll=${ll(locs[0])}&q=${encodeURIComponent(locs[0].name||'Pin')}`;
    g=`https://www.google.com/maps/search/?api=1&query=${ll(locs[0])}`;
  }else{
    a=`https://maps.apple.com/?saddr=${ll(locs[0])}&daddr=${locs.slice(1).map(ll).join('+to:')}`;
    g=`https://www.google.com/maps/dir/?api=1&origin=${ll(locs[0])}&destination=${ll(locs[locs.length-1])}${locs.length>2?`&waypoints=${locs.slice(1,-1).map(ll).join('|')}`:''}`;
  }
  return `<div class="maplinks"><a href="${a}" target="_blank" rel="noopener">Apple Maps</a><a href="${g}" target="_blank" rel="noopener">Google Maps</a></div>`;
}

// ══════════ location picker ══════════
let pickMap=null;
function locPickerHTML(){return `<div id="locwrap" class="loc-list"></div>
 ${F&&F.showAddr?'<div id="loc-addr" class="hint" style="margin:0 0 8px" hidden></div>':''}
 <div class="searchrow"><input id="loc-q" placeholder="Search a place or address" onkeydown="if(event.key==='Enter'){event.preventDefault();locSearch()}"><button onclick="locSearch()">Search</button></div>
 <div id="loc-results" class="results"></div>
 <div class="hint">Search above, or tap the map to drop a pin.</div>
 <div id="pickmap" class="map" style="height:180px;margin-top:8px"></div>`}
function drawLocPicker(){
  const wrap=$('locwrap');if(!wrap)return;
  // the home picker's Location row shows the street address (the label holds the nickname)
  wrap.innerHTML=F.locs.map((l,ix)=>`<div class="loc-row">${F.max>1?`<span class="n">${ix+1}</span>`:'📍'}<span class="grow">${esc(F.showAddr&&l.addr?l.addr:l.name)}</span>${F.max>1&&F.locs.length>1?`<button class="x" onclick="mvLoc(${ix},-1)" ${ix===0?'disabled style="opacity:.25"':''}>▲</button><button class="x" onclick="mvLoc(${ix},1)" ${ix===F.locs.length-1?'disabled style="opacity:.25"':''}>▼</button>`:''}<button class="x" onclick="rmLoc(${ix})">✕</button></div>`).join('');
  setTimeout(()=>{
    const el=$('pickmap');if(!el)return;
    if(pickMap){try{pickMap.remove()}catch(e){}pickMap=null}
    pickMap=mkMap('pickmap');
    const pts=homeMarkers(pickMap);
    F.locs.forEach((l,ix)=>{addNumPin(pickMap,l,ix,F.locs.length>1?F.locs.length:1);pts.push([l.lat,l.lng])});
    fit(pickMap,pts);
    pickMap.on('click',e=>{
      const name=prompt('Name this spot:','');if(name===null)return;
      addLoc({name:name||'Pinned spot',lat:+e.latlng.lat.toFixed(6),lng:+e.latlng.lng.toFixed(6)});
    });
  },30);
  updateLocAddr();
}
const addrCache={};
function fmtAddr(a,fallback){
  a=a||{};
  const street=[a.house_number,a.road].filter(Boolean).join(' ');
  const city=a.city||a.town||a.village||a.hamlet||a.county||'';
  return [street,city,[a.state,a.postcode].filter(Boolean).join(' ')].filter(Boolean).join(', ')||fallback||'';
}
async function updateLocAddr(){
  const el=$('loc-addr');if(!el)return;
  const l=F.locs[0];
  // a spot with a captured exact address shows it in the Location row itself; the hint
  // line is only for pins with no known address, via reverse lookup — which snaps to the
  // nearest OSM address point and can be a neighbor's, hence "(approximate)"
  if(!l||l.addr){el.hidden=true;return}
  el.hidden=false;
  const key=l.lat+','+l.lng;
  if(!(key in addrCache)){
    el.textContent='Looking up address…';
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${l.lat}&lon=${l.lng}`);
      const js=await r.json();
      addrCache[key]=fmtAddr(js.address,js.display_name);
    }catch(e){addrCache[key]=''}
  }
  const cur=F&&F.locs[0],el2=$('loc-addr');
  if(!el2||!cur||cur.addr||cur.lat+','+cur.lng!==key)return; // sheet closed or pin moved mid-lookup
  el2.textContent=addrCache[key]?'📮 '+addrCache[key]+' (approximate)':'Address unavailable for this spot';
}
function rmLoc(ix){F.locs.splice(ix,1);drawLocPicker()}
function mvLoc(ix,n){const t=F.locs.splice(ix,1)[0];F.locs.splice(ix+n,0,t);drawLocPicker()}
function addLoc(l){
  if(F.max===1)F.locs=[l];
  else if(F.locs.length>=F.max)return toast('That’s a lot of stops! (max '+F.max+')');
  else F.locs.push(l);
  if($('loc-results'))$('loc-results').innerHTML='';
  if($('loc-q'))$('loc-q').value='';
  drawLocPicker();
}
const shortName=s=>s.split(',').slice(0,2).join(',');
// Photon (keyless, OSM data) handles place-name search far better than Nominatim:
// typo-tolerant, partial matches, and biased toward home so nearby spots rank first.
// Nominatim stays as the fallback — it's better at raw street addresses, and a
// backstop if Photon is down. (Google Places would need a billed API key.)
async function searchPlaces(q){
  const b=(S.settings&&S.settings.homes||[]).find(h=>h&&h.lat!=null);
  try{
    const r=await fetch(`https://photon.komoot.io/api/?limit=6&lang=en${b?`&lat=${b.lat}&lon=${b.lng}`:''}&q=${encodeURIComponent(q)}`);
    const js=await r.json();
    const out=(js.features||[]).map(f=>{
      const p=f.properties||{},[lng,lat]=f.geometry.coordinates;
      const addr=fmtAddr({house_number:p.housenumber,road:p.street,city:p.city||p.district,state:p.state,postcode:p.postcode},'');
      return {name:p.name||addr||'Unnamed place',lat:+lat.toFixed(6),lng:+lng.toFixed(6),addr};
    });
    if(out.length)return out;
  }catch(e){}
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&addressdetails=1&q=${encodeURIComponent(q)}`);
  const js=await r.json();
  return js.map(p=>({name:shortName(p.display_name),lat:+p.lat,lng:+p.lon,addr:fmtAddr(p.address,p.display_name)}));
}
async function locSearch(){
  const q=$('loc-q').value.trim();if(!q)return;
  $('loc-results').innerHTML='<div class="hint">Searching…</div>';
  try{
    const results=await searchPlaces(q);
    $('loc-results').innerHTML=results.length?results.map(p=>{
      const l={name:p.name,lat:p.lat,lng:p.lng};
      if(F&&F.showAddr)l.addr=p.addr||null;
      const payload=JSON.stringify(l).replace(/'/g,'&#39;').replace(/"/g,'&quot;');
      return `<button onclick='addLoc(JSON.parse(this.dataset.l))' data-l="${payload}">📍 ${esc(p.name)}${p.addr&&p.addr!==p.name?`<span style="color:var(--muted)"> · ${esc(p.addr)}</span>`:''}</button>`;
    }).join(''):'<div class="hint">No results — try adding the city or neighborhood.</div>';
  }catch(e){$('loc-results').innerHTML='<div class="hint">Search failed — check your connection.</div>'}
}
// ══════════ journal ══════════
// the album is paged by month, sharing S.cal with the calendar so switching views keeps
// your place. Its arrows skip straight to the next month that actually has memories, so
// you never step through empty ones.
const monthKey=d=>(d.day||'').slice(0,7);
const calKey=()=>`${S.cal.getFullYear()}-${String(S.cal.getMonth()+1).padStart(2,'0')}`;
const memoryMonths=()=>[...new Set(liveDates().map(monthKey).filter(Boolean))].sort();
function goMonth(k){const[y,mo]=k.split('-').map(Number);S.cal=new Date(y,mo-1,1);render();window.scrollTo(0,0)}
function albumNav(n){
  const ms=memoryMonths(),cur=calKey();
  const to=n<0?[...ms].reverse().find(m=>m<cur):ms.find(m=>m>cur);
  if(to)goMonth(to);
}
function journalView(){
  const live=liveDates(),trash=S.dates.filter(d=>d.trash);
  const seg=`<div class="seg"><button class="${S.journalMode==='album'?'on':''}" onclick="S.journalMode='album';render()">📸 Album</button><button class="${S.journalMode==='cal'?'on':''}" onclick="S.journalMode='cal';render()">🗓️ Calendar</button></div>`;
  const cur=calKey(),ms=memoryMonths();
  const monthRow=(S.journalMode==='album'&&live.length)?`<div class="cal-head">
    <button onclick="albumNav(-1)" ${ms.some(m=>m<cur)?'':'disabled style="opacity:.25"'}>‹</button>
    <h3>${S.cal.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3>
    <button onclick="albumNav(1)" ${ms.some(m=>m>cur)?'':'disabled style="opacity:.25"'}>›</button></div>`:'';
  let body;
  if(!live.length)body=`<div class="empty"><div class="big">📖</div>No memories yet.<br>Tap <b>+</b> to record your first date —<br>past ones count too!</div>`;
  else if(S.journalMode==='album')body=live.filter(d=>monthKey(d)===cur).map(d=>{
    const ph=photosOf(d.id);
    return `<div class="card mem-card" onclick="openDate('${d.id}')">
      <span class="mem-day">${fmtDay(d.day)}${d.time?' · '+fmtTime(d.time):''}</span>

      ${(d.locs||[]).length?`<div class="idea-meta">📍 ${(d.locs||[]).map(l=>esc(l.name)).join(' → ')}</div>`:''}
      ${ph.length?`<div class="thumbstrip">${ph.slice(0,8).map(p=>`<img src="${p.thumb}">`).join('')}</div>`:''}
      ${ph.length?`<div class="mem-icons">📷 ${ph.length}</div>`:''}</div>`;
  }).join('')||`<div class="empty">Nothing logged this month.<br>Use ‹ › to browse the months you have memories in.</div>`;
  else body=calendarView();
  const trashSec=(S.journalMode==='album'&&trash.length)?`<div class="section-title">🗑️ Trash</div>`+trash.map(d=>{
    const mine=d.trash.by===S.me;

      <p class="hint" style="margin:2px 0 8px">Moved to trash by ${esc(pname(d.trash.by))}. ${mine?`It's only deleted forever once ${esc(pname(otherOf(S.me)))} confirms.`:'Restore it, or confirm to delete it forever.'}</p>
      <button class="btn small ghost" style="margin-top:0" onclick="restoreDate('${d.id}')">Restore</button>
      ${mine?'':`<button class="btn small" style="background:#b3413f;margin-left:8px;margin-top:0" onclick="hardDeleteDate('${d.id}')">Delete forever</button>`}</div>`;
  }).join(''):'';
  return `<h1 class="screen-title">Our journal</h1><p class="screen-sub">${live.length} memor${live.length===1?'y':'ies'} so far</p>${seg}${monthRow}${body}${trashSec}`;
}
function calendarView(){
  const y=S.cal.getFullYear(),mo=S.cal.getMonth();
  const startDow=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
  const byDay={};liveDates().forEach(d=>{(byDay[d.day]=byDay[d.day]||[]).push(d)});
  const tstr=todayStr();
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell blank"></div>';
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const es=byDay[ds]||[];
    if(!es.length){cells+=`<div class="cal-cell ${ds===tstr?'today':''}"><span class="dnum">${dd}</span></div>`;continue}
    const ph=coverOf(es[0]);
    cells+=`<div class="cal-cell has ${ph?'':'nopic'} ${ds===tstr?'today':''}" onclick="calTap('${ds}')">
      ${ph?`<img src="${ph.thumb}">`:''}<span class="dnum">${dd}</span></div>`;
  }
  const mn=S.cal.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const ms=memoryMonths(),cur=calKey(),lo=ms[0],hi=ms[ms.length-1];
  return `<div class="cal-head"><button onclick="calNav(-1)" ${cur>lo?'':'disabled style="opacity:.25"'}>‹</button><h3>${mn}</h3><button onclick="calNav(1)" ${cur<hi?'':'disabled style="opacity:.25"'}>›</button></div>
  <div class="cal-grid">${['S','M','T','W','T','F','S'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>`;
}
// the calendar steps month by month (unlike the album, empty months in between are worth
// seeing) but stays inside the span of months you actually have memories in
function calNav(n){
  const ms=memoryMonths();if(!ms.length)return;
  const d=new Date(S.cal.getFullYear(),S.cal.getMonth()+n,1);
  let k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if(k<ms[0])k=ms[0];
  if(k>ms[ms.length-1])k=ms[ms.length-1];
  goMonth(k);
}
function calTap(ds){
  const es=liveDates().filter(d=>d.day===ds);
  if(es.length===1)return openDate(es[0].id);
  openOverlay(`<div class="sheet-head"><button class="hbtn subtle" onclick="closeTop()">✕</button><h2>${fmtDay(ds)}</h2><span></span></div>
   <div class="sheet-body">${es.map(d=>`<div class="card mem-card" onclick="closeTop();openDate('${d.id}')"><div class="mem-title">${esc(d.title)}</div></div>`).join('')}</div>`);
}

async function loadBitmap(file){
  try{return await createImageBitmap(file)}
  catch(e){return await new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(file)})}
}
function drawScaled(src,maxDim,q){
  const w=src.width,h=src.height,sc=Math.min(1,maxDim/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function compressPhoto(file){
  const bmp=await loadBitmap(file);
  let dim=1600,q=0.82,full=drawScaled(bmp,dim,q);
  while(full.length>930000&&q>0.45){q-=0.08;full=drawScaled(bmp,dim,q)}
  while(full.length>930000&&dim>640){dim=Math.round(dim*0.8);full=drawScaled(bmp,dim,q)}
  const thumb=drawScaled(bmp,400,0.68);
  return {full,thumb};
}

// pinch to zoom / drag to pan / double-tap, in raw pointer events.
// transform-origin is the box center: a screen point p maps to p*scale + t.
let Z=null;
function vResetZoom(animate){Z={scale:1,tx:0,ty:0,ptrs:new Map(),start:null,pinch:null,lastTap:0};vApplyZoom(animate)}
function vApplyZoom(animate){
  const img=$('v-img');if(!img)return;
  img.style.transition=animate?'transform .18s':'none';
  img.style.transform=`translate(${Z.tx}px,${Z.ty}px) scale(${Z.scale})`;
}
function vClamp(){
  const box=document.querySelector('#viewer .v-img');if(!box)return;
  const mx=(Z.scale-1)*box.clientWidth/2,my=(Z.scale-1)*box.clientHeight/2;
  Z.tx=Math.max(-mx,Math.min(mx,Z.tx));Z.ty=Math.max(-my,Math.min(my,Z.ty));
}
function vMid(box){ // pinch midpoint relative to box center
  const r=box.getBoundingClientRect(),[a,b]=[...Z.ptrs.values()];
  return {x:(a.x+b.x)/2-r.left-r.width/2,y:(a.y+b.y)/2-r.top-r.height/2};
}
function vSetScale(s,m){ // rescale keeping point m (box-center coords) stationary
  s=Math.min(5,Math.max(1,s));
  Z.tx=m.x-(m.x-Z.tx)*(s/Z.scale);Z.ty=m.y-(m.y-Z.ty)*(s/Z.scale);
  Z.scale=s;if(s===1){Z.tx=0;Z.ty=0}
  vClamp();
}
function vPtrDown(e){
  e.preventDefault();
  try{e.currentTarget.setPointerCapture(e.pointerId)}catch(err){}
  Z.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Z.ptrs.size===1){
    Z.start={tx:Z.tx,ty:Z.ty,x:e.clientX,y:e.clientY};
    Z.gest={x:e.clientX,y:e.clientY,t:Date.now(),multi:false,moved:false};
    // double-tap only pairs with a previous *clean* tap (recorded on pointerup)
    if(Date.now()-Z.lastTap<300&&Math.hypot(e.clientX-Z.tapX,e.clientY-Z.tapY)<40){
      const box=e.currentTarget,r=box.getBoundingClientRect();
      if(Z.scale>1)vResetZoom(true);
      else{vSetScale(2.5,{x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2});vApplyZoom(true)}
      Z.lastTap=0;Z.start=null;Z.gest=null;
    }
  }else if(Z.ptrs.size===2){
    const [a,b]=[...Z.ptrs.values()];
    Z.pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),scale:Z.scale};Z.start=null;
    if(Z.gest)Z.gest.multi=true;
  }
}
function vPtrMove(e){
  if(!Z.ptrs.has(e.pointerId))return;
  Z.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Z.gest&&Math.hypot(e.clientX-Z.gest.x,e.clientY-Z.gest.y)>8)Z.gest.moved=true;
  if(Z.ptrs.size===2&&Z.pinch){
    const [a,b]=[...Z.ptrs.values()];
    vSetScale(Z.pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/Z.pinch.dist,vMid(e.currentTarget));
    vApplyZoom(false);
  }else if(Z.ptrs.size===1&&Z.start&&Z.scale>1){
    Z.tx=Z.start.tx+(e.clientX-Z.start.x);Z.ty=Z.start.ty+(e.clientY-Z.start.y);
    vClamp();vApplyZoom(false);
  }
}
function vPtrUp(e){
  Z.ptrs.delete(e.pointerId);
  Z.pinch=null;
  if(Z.ptrs.size===1){const p=[...Z.ptrs.values()][0];Z.start={tx:Z.tx,ty:Z.ty,x:p.x,y:p.y}}
  else Z.start=null;
  if(!Z.ptrs.size){
    if(Z.gest&&!Z.gest.multi&&!Z.gest.moved&&Date.now()-Z.gest.t<250){Z.lastTap=Date.now();Z.tapX=Z.gest.x;Z.tapY=Z.gest.y}
    Z.gest=null;
    if(Z.scale<1.05&&Z.scale!==1)vResetZoom(true); // snap back from a near-1x pinch
  }
}
function vWheel(e){
  e.preventDefault();
  const box=e.currentTarget,r=box.getBoundingClientRect();
  vSetScale(Z.scale*(e.deltaY<0?1.15:0.87),{x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2});
  vApplyZoom(false);
}
async function vShow(){

 ${catRow}
 <div id="bigmap" class="map tall${catRow?' with-cats':''}"></div>`;

let bigMemGroups={};
function drawBigMap(){

  if(bigShow.mems)liveDates().forEach(d=>(d.locs||[]).forEach(l=>{
    const key=l.lat+','+l.lng;
    const g=bigMemGroups[key]=bigMemGroups[key]||{name:l.name,lat:l.lat,lng:l.lng,ids:[]};
    if(!g.ids.includes(d.id))g.ids.push(d.id);
  }));
  Object.entries(bigMemGroups).forEach(([key,g])=>{
    const ds=g.ids.map(id=>S.dates.find(x=>x.id===id)).filter(Boolean);
    const head=ds.length===1?`<b>📖 ${esc(ds[0].title)}</b><br>${fmtDay(ds[0].day)}`
      :`<b>📖 ${ds.length} memories here</b><br>${esc(g.name)}`;
    L.marker([g.lat,g.lng],{icon:L.divIcon({className:'',html:'<div class="mem-pin"></div>',iconSize:[0,0]})}).addTo(bigMap)
     .bindPopup(`${head}<div class="maplinks"><a href="#" onclick="flashback('${key}');return false">⏪ Flashback</a></div>`);
    pts.push([g.lat,g.lng]);
  });
  fit(bigMap,pts);
}
function flashback(key){
  const g=bigMemGroups[key];if(!g)return;
  if(g.ids.length===1)return openDate(g.ids[0]);
  openOverlay(`<div class="sheet-head"><button class="hbtn subtle" onclick="closeTop()">✕</button><h2>📖 ${esc(g.name)}</h2><span></span></div>
   <div class="sheet-body">${g.ids.map(id=>{const d=S.dates.find(x=>x.id===id);return d?`<div class="card mem-card" onclick="closeTop();openDate('${d.id}')"><span class="mem-day">${fmtDay(d.day)}</span><div class="mem-title">${esc(d.title)}</div></div>`:''}).join('')}</div>`);
}

// ══════════ settings ══════════
function settingsView(){
  const st=S.settings,homes=st.homes||[];
  const myIx=S.me==='A'?0:1;
  return `<h1 class="screen-title">Settings</h1>
   <div class="card"><div class="section-title" style="margin-top:0">Home base 🏠</div>
     <p class="hint" style="margin-top:0">Set your home location to display on maps.</p>
     ${['A','B'].map((k,ix)=>{const h=homes[ix],mine=ix===myIx;return `<label>${esc(pname(k))}'s place${mine?' (you)':''}</label>
       <div class="loc-row">${h&&h.lat!=null?`<span class="grow">📍 ${esc(h.addr||h.label)}</span>`:`<span class="grow" style="color:var(--muted)">Not set yet</span>`}${mine?`<button class="x" style="color:var(--rose-dark);font-size:14px;font-weight:700" onclick="pickHome(${ix})">${h&&h.lat!=null?'Change':'Set'}</button>`:''}</div>`}).join('')}
   </div>
   <div class="card"><div class="section-title" style="margin-top:0">Account</div>
     <p class="hint" style="margin-top:0">Signed in as ${esc(S.user.email||'')}.</p>
     <button class="btn small ghost" onclick="signOut()">Sign out</button></div>
   <div class="card"><div class="section-title" style="margin-top:0">Backup</div>
     <p class="hint" style="margin-top:0">Downloads everything — ideas, memories, notes, and photos — as one JSON file. Do it once in a while!</p>
     <button class="btn small" onclick="backup()">Download backup</button></div>`;
}
function setMe(k){S.me=k;localStorage.setItem('dj_me',k);render();toast(`Hi, ${pname(k)}!`)}
function pickHome(ix){
  if(ix!==(S.me==='A'?0:1))return toast('You can only set your own home');
  F={locs:[],max:1,homeIx:ix,showAddr:true};
  const h=(S.settings.homes||[])[ix];
  if(h&&h.lat!=null)F.locs=[{name:h.label,lat:h.lat,lng:h.lng,addr:h.addr||null}];
  openOverlay(`<div class="sheet-head"><button class="hbtn subtle" onclick="closeTop()">Cancel</button><h2>Set home base</h2><button class="hbtn" onclick="saveHome()">Save</button></div>
   <div class="sheet-body"><label>Label</label><input id="f-hlabel" value="${esc(h&&h.label?h.label:pname(ix===0?'A':'B')+'’s place')}">
   <label>Location</label>${locPickerHTML()}</div>`);
  drawLocPicker();
}
function saveHome(){
  const l=F.locs[0];if(!l)return toast('Pick a location first');
  const homes=(S.settings.homes||[]).slice();while(homes.length<2)homes.push(null);
  homes[F.homeIx]={label:$('f-hlabel').value.trim()||l.name,lat:l.lat,lng:l.lng,addr:l.addr||addrCache[l.lat+','+l.lng]||null};
  db.collection('meta').doc('settings').set({homes},{merge:true}).then(()=>{closeTop();toast('Home saved 🏠')});
}
async function backup(){
  toast('Preparing backup…',10000);
  const fulls={};
  for(const p of S.photos){
    try{const d=await db.collection('photoFulls').doc(p.fullId).get();fulls[p.fullId]=(d.data()||{}).data||null}catch(e){}
  }
  const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),settings:S.settings,ideas:S.ideas,dates:S.dates,photos:S.photos.map(p=>({...p,thumb:p.thumb})),photoFulls:fulls})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`date-journal-backup-${todayStr()}.json`;a.click();
  toast('Backup downloaded ✓');
}

// ══════════ shared login ══════════
function loginScreen(){return `<div class="hero"><div class="big"><span class="calico"><i>JUL</i><b>19</b></span></div><h1>ConsoliDated</h1><p>Our dates in one place</p></div>
 <div class="card"><label>Email</label><input id="li-email" type="email" autocomplete="username" placeholder="your sign-in email">
 <label>Password</label><input id="li-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
 <button class="btn" onclick="doLogin()">Unlock</button>
 <div class="hint" id="li-err" style="margin-top:10px;text-align:center"></div></div>`}
async function doLogin(){
  const e=$('li-email').value.trim(),p=$('li-pass').value;
  if(!e||!p)return toast('Email and password, please');
  $('li-err').textContent='';toast('Signing in…',10000);
  try{await firebase.auth().signInWithEmailAndPassword(e,p);toast('Welcome back')}
  catch(err){console.error(err);$('li-err').textContent='That didn’t work — double-check your email & password.';toast('Sign-in failed',2000)}
}
function signOut(){firebase.auth().signOut().then(()=>location.reload())}

// ══════════ first-run screens ══════════
function whoAmI(){return `<div class="hero"><div class="big">👋</div><h1>Who are you?</h1><p>So your notes are saved under the right name.</p></div>
 <button class="whoami-btn" onclick="setMe('A')"><span class="dotA"></span>${esc(pname('A'))}</button>
 <button class="whoami-btn" onclick="setMe('B')"><span class="dotB"></span>${esc(pname('B'))}</button>`}
function configHelp(){return `<div class="hero"><div class="big"><span class="calico"><i>JUL</i><b>19</b></span></div><h1>ConsoliDated</h1><p>Almost there — the app just needs its database keys.</p></div>

// ══════════ wire up & go ══════════
$('photoInput').addEventListener('change',async e=>{
  const files=[...e.target.files];
  if(!files.length||!photoTarget)return;
  let ok=0;
  for(let i=0;i<files.length;i++){
    toast(`Uploading photo ${i+1} of ${files.length}…`,60000);
    try{
      const {full,thumb}=await compressPhoto(files[i]);
      const fr=await db.collection('photoFulls').add({data:full});
      await db.collection('photos').add({dateId:photoTarget,thumb,fullId:fr.id,created:Date.now()+i});
      ok++;
    }catch(err){console.error(err)}
  }
  toast(ok===files.length?(ok>1?`${ok} photos added ✓`:'Photo added ✓'):`${ok} of ${files.length} added — one photo format didn't work`);
});
boot();
render();
</script>
